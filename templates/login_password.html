{% extends "base.html" %}
{% block content %}

<section class="auth-shell">
    <div class="auth-panel auth-panel-visual">
        <span class="auth-kicker">Correo validado</span>
        <h1 class="auth-title">Completa tu acceso</h1>
        <p class="auth-text">
            Tu correo ya fue verificado. Ingresa tu contraseña para entrar al panel correspondiente.
        </p>
    </div>

    <div class="auth-panel auth-panel-form">
        <div class="auth-card">
            <h2 class="auth-form-title">Contraseña</h2>
            <p class="auth-form-text">{{ email }} · {{ rol }}</p>

            <form method="POST" class="auth-form">
                <label for="password">Contraseña</label>
                <div class="password-field">
                    <input id="password" type="password" name="password" class="form-control auth-input" autocomplete="current-password" required>
                    <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Ver contraseña" title="Ver contraseña">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button class="btn-cafe btn-cafe-primary auth-submit" type="submit">Ingresar</button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
