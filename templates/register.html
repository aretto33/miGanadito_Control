{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <h3 class="text-center mb-3">Registrar usuario</h3>

        <form method="POST" class="card p-4 shadow">

            <img src="{{ url_for('static', filename='img/new.png') }}" class="img-fluid mb-3">

            <!-- DATOS DE USUARIO -->
            <label>Usuario:</label>
            <input type="text" name="usuario" class="form-control mb-3" required>

            <label>Contraseña:</label>
            <input type="password" name="password" class="form-control mb-3" required>

            <input type="hidden" name="rol" value="Productor">
            <div class="mb-3">
                <small>Se registrará automáticamente como <strong>Productor</strong>.</small>
            </div>

            <!-- DATOS EXTRA PARA PRODUCTOR -->
            <div id="formProductor" class="border rounded p-3 mb-3" style="display:block; background:#f9f9f9;">
                <h5>Datos del Productor</h5>

                <label>Nombre:</label>
                <input type="text" name="prod_nombre" class="form-control mb-2" required>

                <label>Apellido paterno:</label>
                <input type="text" name="prod_apellido_pat" class="form-control mb-2" required>

                <label>Apellido materno:</label>
                <input type="text" name="prod_apellido_mat" class="form-control mb-2">

                <label>RFC:</label>
                <input type="text" name="prod_rfc" class="form-control mb-2">
            </div>

            <button class="btn btn-success w-100">Registrar</button>
        </form>

    </div>
</div>

<script>
    // El registro siempre se realiza como Productor.
    // El formulario muestra directamente los campos necesarios para Productor.
</script>

{% endblock %}
